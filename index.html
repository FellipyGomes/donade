<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Donade Confeitaria</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #fff5f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

       .instagram a {
    color: #666;
    text-decoration: none;
    font-size: 14px;
}

       .logo {
width: 230px;
height: 230px;
object-fit: contain;
display: block;
margin: 0 auto 16px;
background: transparent;
}


        .subtitle {
            text-align: center;
            color: #666;
            margin-top: 1px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            border: none;
            background: #e85d8c;
            color: white;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #d94d7e;
        }
    </style>
</head>
<body>

    <div class="card">

        <header class="brand">
     <img id="logo" class="logo" src="logos/donade.png" alt="Logo">
            
                <p class="subtitle">
            Docê é amor, em forma de sabor!
        </p>

       <form id="loginForm" onsubmit="return false;">

            <label for="nome">
                Seu nome
            </label>

            <input
                type="text"
                id="nome"
                placeholder=""
            >

            <label for="telefone">
                Telefone com DDD
            </label>

            <input
                type="tel"
                id="telefone"
                placeholder=""
            >

           <button type="button" id="entrarBtn">
                Entrar
            </button>
           <div class="instagram">
               <a href="https://instagram.com/donadeconfeitaria" target="_blank">
            @donade.confeitaria
    </a>
</div>
        </form>

    </div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {
getDatabase,
ref,
get,
set
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyByPVL7_1BNkWzv-WbnQ-EM3zjUyA9Qflc",
    authDomain: "donadeconfe.firebaseapp.com",
    projectId: "donadeconfe",
    storageBucket: "donadeconfe.firebasestorage.app",
    messagingSenderId: "157881255215",
    appId: "1:157881255215:web:212f1c5906436c1879cdda"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const botao = document.getElementById("entrarBtn");

botao.addEventListener("click", async function(){

    botao.disabled = true;

    try {

        const nome = document.getElementById("nome").value.trim();
        const telefone = document
    .getElementById("telefone")
    .value
    .replace(/\D/g, "");

        if (!nome || !telefone) {
            alert("Preencha nome e telefone.");
            return;
        }

        const clienteRef = ref(db, "clientes/" + telefone);

        const snapshot = await get(clienteRef);

        if (!snapshot.exists()) {

            await set(clienteRef, {
                nome,
                telefone,
                pontos: 0
            });

            alert("Cadastro realizado com sucesso!");

        } else {

            alert("Bem-vindo de volta!");

        }

    } catch (erro) {

        console.error("Erro:", erro);
        alert("Ocorreu um erro.");

    } finally {

        botao.disabled = false;

    }

});
    

</script>

</body>
</html>
