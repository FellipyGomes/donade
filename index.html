<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Donade Confeitaria</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

    .owner{
    margin-top:4px;
    font-size:12px;
    color:#999;
}
  body{
    background-color:#fff5f8;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    height:100vh;
    margin:0;
    overflow:hidden;
}

.card{
    width:90%;
    max-width:400px;
    padding:20px;
    margin-top:90px;
}

.logo{
    width:210px;
    height:210px;
    object-fit:contain;
    display:block;
    margin:0 auto 10px;
    background: transparent;
}

.subtitle {
    text-align: center;
    color: #777;
    font-style: italic;
    margin: -5px 0 45px 0;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
    font-size:13px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #eee;
    background:#fcfcfc;
    border-radius:12px;
    margin-bottom:15px;
    font-size:15px;
}
    input:focus{
    outline:none;
    border-color:#e85d8c;
    box-shadow:0 0 0 3px rgba(232,93,140,.15);
}

button{
    width:100%;
    border:none;
    background:#e85d8c;
    color:white;
    padding:15px;
    border-radius:12px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#d94d7e;
}

.instagram{
    text-align:center;
    margin-top:20px;
}

.instagram a{
    color:#ff77a9;
    font-weight:bold;
    text-decoration:none;
    font-size:14px;
    transition:.3s;
}

.instagram a:hover{
    color:#e85d8c;
    text-decoration:underline;
}

@media (max-height: 750px){

    .logo{
        width:210px;
        height:210px;
    }

    .card{
        padding:18px;
    }

    .subtitle{
        margin-bottom:20px;
        font-size:14px;
    }

    input{
        padding:12px;
        margin-bottom:12px;
    }

    button{
        padding:12px;
    }

}

</style>
</head>

<body>

<div class="card">

     <img id="logo" class="logo" src="logos/donade.png" alt="Logo">

    <p class="subtitle">
        Docê é amor, em forma de sabor!
    </p>

    <form onsubmit="return false;">

        <label for="nome">
            Seu nome
        </label>

        <input
            type="text"
            id="nome"
            placeholder="Digite seu nome"
        >

        <label for="telefone">
            Telefone
        </label>

        <input
            type="tel"
            id="telefone"
            placeholder="(19)99999-9999"
        >

        <button type="button" id="entrarBtn">
            Entrar
        </button>

        <div class="instagram">
          <a href="https://instagram.com/donade.confeitaria" target="_blank">
                @donade.confeitaria
            </a>

            <p class="owner">
por Tamires Teles
</p>
        </div>    

    </form>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {
    getDatabase,
    ref,
    get,
    set
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyByPVL7_1BNkWzv-WbnQ-EM3zjUyA9Qflc",
    authDomain: "donadeconfe.firebaseapp.com",
    projectId: "donadeconfe",
    storageBucket: "donadeconfe.firebasestorage.app",
    messagingSenderId: "157881255215",
    appId: "1:157881255215:web:212f1c5906436c1879cdda"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const botao = document.getElementById("entrarBtn");

botao.addEventListener("click", async () => {

    botao.disabled = true;
    botao.textContent = "Entrando...";

    try {

        const nome =
            document.getElementById("nome")
            .value
            .trim();

        const telefone =
            document.getElementById("telefone")
            .value
            .replace(/\D/g, "");

        if(!nome || !telefone){
            alert("Preencha nome e telefone.");
            return;
        }

        const clienteRef = ref(db, "clientes/" + telefone);

        const snapshot = await get(clienteRef);

        if(!snapshot.exists()){

            await set(clienteRef,{
                nome,
                telefone,
                pontos:0
            });

        }

        localStorage.setItem("telefoneCliente", telefone);
        localStorage.setItem("nomeCliente", nome);

        window.location.href = "cartao.html";

    } catch(erro){

        console.error(erro);
        alert("Erro ao acessar o sistema.");

    } finally {

        botao.disabled = false;
        botao.textContent = "Entrar";

    }

});

</script>

</body>
</html>
