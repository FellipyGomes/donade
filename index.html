<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donadê Confeitaria</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        
        body {
            background-color: #fff5f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .logo {
            text-align: center;
            font-size: 50px;
        }

        h1 {
            text-align: center;
            color: #e85d8c;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            border: none;
            background: #e85d8c;
            color: white;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #d94d7e;
        }
    </style>
</head>
<body>

    <div class="card">

        <div class="logo">🍬</div>

        <h1>Donadê Confeitaria</h1>

        <p class="subtitle">
            Docê é amor, em forma de sabor!
        </p>

        <form id="loginForm">

            <label for="nome">
                Primeiro Nome
            </label>

            <input
                type="text"
                id="nome"
                placeholder=""
            >

            <label for="telefone">
                Telefone
            </label>

            <input
                type="tel"
                id="telefone"
                placeholder="19999999999"
            >

            <button type="submit">
                Entrar
            </button>

        </form>

    </div>

 <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getFirestore } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyByPVL7_1BNkWzv-WbnQ-EM3zjUyA9Qflc",
    authDomain: "donadeconfe.firebaseapp.com",
    projectId: "donadeconfe",
    storageBucket: "donadeconfe.firebasestorage.app",
    messagingSenderId: "157881255215",
    appId: "1:157881255215:web:212f1c5906436c1879cdda",
    measurementId: "G-367D6NTQPE"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  console.log("Firestore conectado!");
     import {
  collection,
  query,
  where,
  getDocs,
  addDoc
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const form = document.getElementById("loginForm");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const nome = document.getElementById("nome").value.trim();
  const telefone = document.getElementById("telefone").value.trim();

  if (!nome || !telefone) {
    alert("Preencha todos os campos");
    return;
  }

  const clientesRef = collection(db, "clientes");

  const q = query(
    clientesRef,
    where("telefone", "==", telefone)
  );

  const resultado = await getDocs(q);

  if (resultado.empty) {
    await addDoc(clientesRef, {
      nome,
      telefone,
      pontos: 0,
      criadoEm: new Date()
    });

    alert("Cadastro criado!");
  } else {
    alert("Bem-vindo de volta!");
  }
});
</script>

</body>
</html>
