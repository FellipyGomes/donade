<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meu Cartão Fidelidade</title>

<style>

body{
    background-color:#fff5f8;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    height:100vh;
    margin:0;
    overflow:hidden;
    font-family:Arial, sans-serif;
}

.card-fidelidade{
    width:90%;
    max-width:400px;
    padding:20px;
    margin-top:30px;
    text-align:center;
}

.logo{
    width:180px;
    height:180px;
    object-fit:contain;
    display:block;
    margin:0 auto 10px;
}

#saudacao{
    color:#e85d8c;
    margin-bottom:15px;
}

.grade-pontos{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:12px;
    max-width:220px;
    margin:25px auto;
}

.bolinha{
    width:30px;
    height:30px;
    border:3px solid #e85d8c;
    border-radius:50%;
}

.preenchida{
    background:#e85d8c;
}

</style>
</head>

<body>

<div class="card-fidelidade">

    <img class="logo"     <h2 id="saudacao">
        Olá, Cliente!
    </h2>

    <p id="mensagem"></p>

    <div id="pontos" class="grade-pontos"></div>

</div>

<script>

const pontosCliente = 3;
const totalNecessario = 15;

const container = document.getElementById("pontos");
    
    const nome = localStorage.getItem("nomeCliente");

document.getElementById("saudacao").innerText =
`Olá, ${nome}!`;

for(let i=1; i<=totalNecessario; i++){

    const bolinha = document.createElement("div");

    bolinha.classList.add("bolinha");

    if(i <= pontosCliente){
        bolinha.classList.add("preenchida");
    }

    container.appendChild(bolinha);
}

const faltam = totalNecessario - pontosCliente;

document.getElementById("mensagem").innerText =
`Faltam apenas ${faltam} unidades para ganhar seu pão de mel!`;

</script>

</body>
</html>
