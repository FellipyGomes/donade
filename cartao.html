<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meu Cartão Fidelidade</title>

<style>

    label{
    display:block;
    margin-top:20px;
    margin-bottom:10px;
    font-weight:bold;
    font-size:14px;
}

select{
    width:100%;
    padding:14px;
    border:1px solid #eee;
    background:#fcfcfc;
    border-radius:12px;
    margin-bottom:15px;
    font-size:15px;
}

select:focus{
    outline:none;
    border-color:#e85d8c;
    box-shadow:0 0 0 3px rgba(232,93,140,.15);
}

#registrarBtn{
    width:100%;
    border:none;
    background:#e85d8c;
    color:white;
    padding:15px;
    border-radius:12px;
    font-size:16px;
    cursor:pointer;
}

#registrarBtn:hover{
    background:#d94d7e;
}

body{
    background-color:#fff5f8;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    height:100vh;
    margin:0;
    overflow:hidden;
    font-family:Arial, sans-serif;
}

.card-fidelidade{
    width:90%;
    max-width:400px;
    padding:20px;
    margin-top:30px;
    text-align:center;
}

.logo{
    width:180px;
    height:180px;
    object-fit:contain;
    display:block;
    margin:0 auto 10px;
}

#saudacao{
    color:#e85d8c;
    margin-bottom:15px;
}

.grade-pontos{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:12px;
    max-width:220px;
    margin:25px auto;
}

.bolinha{
    width:30px;
    height:30px;
    border:3px solid #e85d8c;
    border-radius:50%;
}

.preenchida{
    background:#e85d8c;
}

</style>
</head>

<body>

<div class="card-fidelidade">

   <img id="logo" class="logo" src="logos/donade.png" alt="Logo">

    <h2 id="saudacao">Olá, Cliente!</h2>

    <p id="mensagem"></p>

    <div id="pontos" class="grade-pontos"></div>

    <label for="qtdCompra">
    Quantos docinhos você comprou hoje?
</label>

<select id="qtdCompra">
    <option value="1">1 unidade</option>
    <option value="2">2 unidades</option>
    <option value="3">3 unidades</option>
    <option value="4">4 unidades</option>
    <option value="5">5 unidades</option>
</select>

<button id="registrarBtn">
    Registrar compra
</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getDatabase,
    ref,
    get
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

<script>

const telefone = localStorage.getItem("telefoneCliente");

if(!telefone){

    window.location.href = "index.html";

}

const clienteRef = ref(db, "clientes/" + telefone);

const snapshot = await get(clienteRef);

if(snapshot.exists()){

    const cliente = snapshot.val();

    document.getElementById("saudacao").innerText =
        `Olá, ${cliente.nome}!`;

    carregarPontos(cliente.pontos);

}

    function carregarPontos(pontosCliente){

    const totalNecessario = 15;

    const container = document.getElementById("pontos");

    container.innerHTML = "";

    for(let i = 1; i <= totalNecessario; i++){

        const bolinha = document.createElement("div");

        bolinha.classList.add("bolinha");

        if(i <= pontosCliente){
            bolinha.classList.add("preenchida");
        }

        container.appendChild(bolinha);
    }

    const faltam = totalNecessario - pontosCliente;

    document.getElementById("mensagem").innerText =
    `Faltam apenas ${faltam} unidades para ganhar seu prêmio!`;
}
    
</script>

</body>
</html>
